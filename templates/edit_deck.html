{% extends "dashboard_base.html" %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
{% endblock %}

{% block content %}
    <div class="create-deck-container">
        <div class="create-deck-card deck-overview-card">
            <a href="{{ url_for('decks') }}" class="back-link">← Back to My Decks</a>

            <div class="deck-overview-title">
                <h1>{{ form_data.deck_name }}</h1>
                <p>{{ form_data.subject or 'No subject yet' }}</p>
            </div>

            <div class="deck-action-buttons">
                <a href="#" class="btn-primary">▶ Study</a>
                <a href="#" class="btn-secondary">+ Add Card</a>
                <a href="#" class="btn-secondary">✏ Edit Deck</a>
                <a href="#" class="btn-secondary danger-btn">🗑 Delete</a>
            </div>
        </div>
    </div>
{% endblock %}
