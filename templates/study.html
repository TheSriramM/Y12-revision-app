{% extends "dashboard_base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='flashcards.css') }}">
{% endblock %}

{% block content %}

<div class="flashcard-container">

    <a href="{{ url_for('edit_deck', deck_id=deck_id) }}" class="back-link">
        ← {{ deck_name }}
    </a>

    <div class="flashcard-header">
        <span id="card-counter">
            Card {{ current_index + 1 }} of {{ total_cards }}
        </span>
    </div>

    <button
        id="flashcard"
        class="flashcard"
        data-deck="{{ deck_id }}"
        data-index="{{ current_index }}"
        data-total="{{ total_cards }}"
    >
        <span id="card-text">{{ card_text }}</span>
    </button>

    <div class="controls">

        <button
            id="prev-btn"
            class="btn-secondary"
            type="button">
            ← Previous
        </button>

        <button
            id="flip-btn"
            class="btn-primary"
            type="button">
            Flip
        </button>

        <button
            id="next-btn"
            class="btn-secondary"
            type="button">
            Next →
        </button>

    </div>

    <div class="finish-actions">
        <button
            id="finish-btn"
            class="btn-primary finish-btn"
            type="button">
            Finish Study
        </button>
    </div>

</div>

<script src="{{ url_for('static', filename='js/flashcards.js') }}"></script>

{% endblock %}
