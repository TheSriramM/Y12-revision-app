{% extends "base.html" %}

{% block content %}

<h1>Level 2 Chemistry</h1>

<div class="flashcard-container">

    <form method="POST">

        <button
            class="flashcard"
            type="submit"
            name="action"
            value="flip"
        >
            {{ card_text }}
        </button>

        <div class="controls">

            <button
                type="submit"
                name="action"
                value="prev"
            >
                Previous
            </button>

            <button
                type="submit"
                name="action"
                value="next"
            >
                Next
            </button>

        </div>

    </form>

</div>

{% endblock %}
