{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='flashcards.css') }}">
{% endblock %}

{% block content %}

<h1>Level 2 Chemistry</h1>

<div class="flashcard-container">
    
    <div class="flashcard-header">
        <span id="card-counter">Card {{ current_index + 1 }} of {{ total_cards }}</span>
    </div>

    <button
        id="flashcard"
        class="flashcard"
        data-index="{{ current_index }}"
        data-total="{{ total_cards }}"
    >
        <span id="card-text">{{ card_text }}</span>
    </button>

    <div class="controls">
        <button
            id="prev-btn"
            class="control-btn"
        >
            ← Previous
        </button>

        <button
            id="flip-btn"
            class="control-btn flip-btn-primary"
        >
            Flip Card
        </button>

        <button
            id="next-btn"
            class="control-btn"
        >
            Next →
        </button>
    </div>

</div>

<script src="{{ url_for('static', filename='js/flashcards.js') }}"></script>

{% endblock %}
