<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="{{url_for('static', filename='dashboard.css')}}">
    {% block head %}{% endblock %}
</head>
<body>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="toast-container">
            {% for message in messages %}
                <div class="toast-message">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% endwith %}

    <header>
        <h1 class="logo"><b>Quizcards</b></h1>

        <nav class="navbar">
            <div class="nav-left">
                <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
                <a href="{{ url_for('decks') }}" class="nav-link {% if request.endpoint == 'decks' %}active{% endif %}">My Decks</a>
                <a href="{{ url_for('progress') }}" class="nav-link {% if request.endpoint == 'progress' %}active{% endif %}">Progress</a>
            </div>

            <div class="nav-right">
                <a class="profile-link" href="{{ url_for('profile') }}">{{ session['username'] }}</a>
                <a class="profile-btn" href="{{ url_for('profile') }}">
                    👤
                </a>
            </div>
        </nav>
    </header>

    <script src="{{ url_for('static', filename='js/dashboard_base.js') }}" defer></script>
    {% block content %}{% endblock %}

</body>
</html>
