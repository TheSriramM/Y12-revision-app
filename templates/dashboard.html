{% extends "dashboard_base.html" %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <script src="{{ url_for('static', filename='js/flashcards.js') }}"></script>
{% endblock %}

{% block content %}
    <div class="welcome">
        <div class="welcome-card">
            <div class="welcome-content">
                <h2>Welcome back, {{ session['username'] }}!</h2>
                <p>Continue your learning journey</p>
            </div>
            <a href="{{ url_for('decks') }}" class="btn-primary">Continue studying</a>
        </div>
    </div>

    <div class="stats-cards">
        <div class="stat-card">
            <div class="stat-icon">🔥</div>
            <div class="stat-info">
                <h3>Daily Streak</h3>
                <p id="streak-value">0 days</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📚</div>
            <div class="stat-info">
                <h3>Total Decks</h3>
                <p id="total-decks-value">{{ deck_count }}</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-info">
                <h3>Total Tests</h3>
                <p id="total-tests-value">{{ deck_count }}</p>
            </div>
        </div>
    </div>
{% endblock %}
