{% extends "dashboard_base.html" %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
{% endblock %}

{% block content %}
    <div class="add-card-page">

        <div class="add-card-card">

            <div class="add-card-header">
                <a href="{{ url_for('edit_deck', deck_id=deck['id']) }}" class="back-link">← {{ deck['name'] }}</a>
                <h1>Add Flashcard</h1>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for message in messages %}
                            <div class="flash-message">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="post" class="add-card-form">
                <div class="form-group">
                    <label for="question">Question <span class="required-star">*</span></label>
                    <textarea id="question" name="question" rows="5" required>{{ form_data.question }}</textarea>
                </div>

                <div class="form-group">
                    <label for="answer">Answer <span class="required-star">*</span></label>
                    <textarea id="answer" name="answer" rows="5" required>{{ form_data.answer }}</textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" name="action" value="save_add_another" class="btn-primary">Save & Add Another</button>
                    <button type="submit" name="action" value="save" class="btn-primary">Save</button>
                    <a href="{{ url_for('edit_deck', deck_id=deck['id']) }}" class="btn-secondary">Cancel</a>
                </div>
            </form>
            
        </div>

    </div>
{% endblock %}
